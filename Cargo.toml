[package]
name = "xiao-aht10"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xiao-aht10"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "=0.7.6", features = ["set-vtor"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "=0.1.2"
embassy-nrf = { version = "=0.11.0", features = ["nrf52840", "time-driver-rtc1", "unstable-pac"] }
embassy-sync = "=0.8.0"
embassy-time = "=0.5.1"
embassy-usb = { version = "=0.6.0", default-features = false }
embedded-hal = "=1.0.0"
heapless = "=0.8.0"

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"
